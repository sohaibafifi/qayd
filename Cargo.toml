[package]
name = "qayd"
version = "0.1.0"
edition = "2021"
description = "Yet another constraint-programming solver."
license = "MIT"

[lib]
name = "qayd"
path = "src/lib.rs"

[[bin]]
name = "qayd"
path = "src/bin/qayd.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"


[dependencies]
ctrlc = "3.5.2"
lzma-rs = "0.3.0"
# Patched fork: cardinality mixed occurs, %N group injection, notin, stray stdout
# prints. Rev-pinned for reproducibility.
xcsp3-rust-parser = { git = "https://github.com/sohaibafifi/XCSP3-Rust-Parser", rev = "37c9b7dba7690b702ed188e778876fa712083e7c" }
