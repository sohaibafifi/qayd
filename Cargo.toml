[package]
name = "qayd"
version.workspace = true
edition = "2021"
description = "Yet another constraint-programming solver."
license = "MIT"

[workspace]
members = [".", "frontends/flatzinc"]
# Both packages take part in plain `cargo build --bin ...` at the root — the
# release workflow builds `qayd` and `qayd-fzn` in one invocation.
default-members = [".", "frontends/flatzinc"]

[workspace.package]
# Single source of truth: qayd and qayd-fzn release under the same version.
version = "0.7.1"

[lib]
name = "qayd"
path = "src/lib.rs"

[[bin]]
name = "qayd"
path = "src/bin/qayd.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3
overflow-checks = false
panic = "abort"


[dependencies]
ctrlc = "3.5.2"
lzma-rs = "0.3.0"
# Patched fork: cardinality mixed occurs, %N group injection, notin, stray stdout
# prints, lex constant tuples. Rev-pinned for reproducibility.
xcsp3-rust-parser = { git = "https://github.com/sohaibafifi/XCSP3-Rust-Parser", rev = "f38435d7c362a65e275693953a830264b9a384cd" }


# Cold parse/decompress stack: runs once per instance, never in the solve loop.
# Build it for size, not speed — keeps the hot solver (qayd, std) at opt-level 3.
[profile.release.package.regex-automata]
opt-level = "z"
[profile.release.package.regex-syntax]
opt-level = "z"
[profile.release.package.aho-corasick]
opt-level = "z"
[profile.release.package.regex]
opt-level = "z"
[profile.release.package.quick-xml]
opt-level = "z"
[profile.release.package.xcsp3-rust-parser]
opt-level = "z"
[profile.release.package.lzma-rs]
opt-level = "z"
