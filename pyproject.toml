[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "qayd"
version = "0.10.0"
description = "A Unified Semantic Architecture for Heterogeneous Constraint Solving."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.maturin]
features = ["python"]
module-name = "qayd._core"
python-source = "frontends/python"
# `pyext` = release with unwinding panics: PyO3 converts a Rust panic into a
# Python exception instead of aborting the interpreter (release has panic=abort).
profile = "pyext"
