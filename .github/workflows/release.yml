name: Release

# Build the `qayd` binary for every supported target and publish a GitHub
# Release with the archives attached. Fires on version tags, e.g. `v0.1.0`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  # The upload step below attaches assets to an existing Release; it does not
  # create one. Pushing a tag doesn't auto-create a Release, so make it here
  # first. Idempotent so re-runs don't fail.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" \
                 --generate-notes

  upload-assets:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Builds `--release --target <target>` (using `cross` for the Linux ARM
      # target), archives the binary as .tar.gz / .zip, writes a .sha256, and
      # uploads everything to the Release created above. All jobs upsert into
      # the same Release.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: qayd
          target: ${{ matrix.target }}
          archive: qayd-$tag-$target
          include: README.md,LICENSE
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}


  compress-assets:
    name: upx ${{ matrix.target }}
    needs: upload-assets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
    steps:
      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: UPX-compress the released binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          base="qayd-${tag}-${{ matrix.target }}"

          # Discover the actual asset (taiki-e ships .zip for Windows, .tar.gz
          # otherwise) rather than assuming an extension.
          asset=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                    --json assets --jq '.assets[].name' \
                  | grep -E "^${base}\.(tar\.gz|zip)$" | head -n1)
          if [ -z "${asset:-}" ]; then
            echo "No archive found for ${base}; nothing to compress." >&2
            exit 0
          fi
          echo "Compressing asset: $asset"

          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --dir dl
          mkdir ex
          case "$asset" in
            *.tar.gz) tar -xzf "dl/$asset" -C ex ;;
            *.zip)    unzip -q "dl/$asset" -d ex ;;
          esac

          # Round-tripping the archive means we reproduce taiki-e's exact member
          # layout; we only mutate the binary itself.
          binfile=$(find ex -type f \( -name qayd -o -name qayd.exe \) | head -n1)
          before=$(stat -c%s "$binfile")
          upx --best --lzma "$binfile"
          after=$(stat -c%s "$binfile")
          echo "Binary: ${before} -> ${after} bytes"

          # Re-archive with the same members and the same name, then refresh the
          # sha256 sidecar in taiki-e's "<hash>  <name>" format.
          rm -f "$asset"
          ( cd ex && case "$asset" in
              *.tar.gz) tar -czf "../$asset" * ;;
              *.zip)    zip -qr "../$asset" * ;;
            esac )
          sha256sum "$asset" > "$asset.sha256"

          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "$asset" "$asset.sha256" --clobber
