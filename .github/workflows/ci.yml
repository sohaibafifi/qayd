name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  amthal:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: qayd
          persist-credentials: false

      - name: Checkout private Amthal backend
        uses: actions/checkout@v4
        with:
          repository: sohaibafifi/amthal
          token: ${{ secrets.AMTHAL_READ_TOKEN }}
          path: amthal
          persist-credentials: false

      - name: Test LP integration
        working-directory: qayd
        run: cargo test --manifest-path integrations/amthal/Cargo.toml --test lp_relaxation

      - name: Clippy LP integration
        working-directory: qayd
        run: cargo clippy --manifest-path integrations/amthal/Cargo.toml --workspace --all-targets -- -D warnings

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked Python development tools
        run: uv sync --locked --no-install-project

      - name: Resolve all public features without private dependencies
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build Python extension
        run: uv run --no-sync maturin develop --profile pyext --uv

      - name: Test Python API
        run: |
          uv run --no-sync python -c "import qayd._core"
          uv run --no-sync python -m pytest tests/python

      - name: Test golden harness
        run: python3 -m unittest discover -s bench/golden -p 'test_*.py'

      - name: Test parallel regression harness
        run: python3 -m unittest discover -s tests/python -p 'test_parallel_regression.py'

      - name: Run architecture goldens
        env:
          UV_NO_SYNC: "true"
        run: uv run --no-sync python bench/golden/run.py

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy Python extension
        run: cargo clippy --workspace --all-targets --features python -- -D warnings
