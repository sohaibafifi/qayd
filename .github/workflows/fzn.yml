name: qayd-fzn

# Lint, build, and end-to-end-check the FlatZinc frontend. The e2e step writes
# its own tiny models because frontends/flatzinc/tests/ is gitignored; the
# corpus step runs only when data/fzn is present in the checkout.
on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "frontends/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fzn.yml"
  pull_request:
    paths:
      - "src/**"
      - "frontends/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fzn.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Build qayd-fzn
        run: cargo build --release -p qayd-flatzinc

      - name: End-to-end protocol checks
        run: |
          set -euo pipefail
          BIN=target/release/qayd-fzn
          t=$(mktemp -d)

          # Native format: satisfaction.
          cat > "$t/sat.fzn" <<'EOF'
          var 1..3: x;
          var 1..3: y;
          constraint int_ne(x, y);
          constraint int_lin_eq([1, 1], [x, y], 4);
          solve satisfy;
          EOF
          $BIN "$t/sat.fzn" | grep -q "s SATISFIABLE"

          # Native format: optimisation with reification and a time limit.
          cat > "$t/opt.fzn" <<'EOF'
          var 0..10: x;
          var 0..1: b;
          constraint int_le_reif(x, 5, b);
          constraint int_eq(b, 1);
          solve maximize x;
          EOF
          out=$($BIN -t 60 "$t/opt.fzn")
          echo "$out" | grep -q "o 5"
          echo "$out" | grep -q "s OPTIMUM FOUND"

          # MiniZinc protocol: output annotations, solution and proof markers.
          cat > "$t/mzn.fzn" <<'EOF'
          var 0..5: x :: output_var;
          array [1..2] of var bool: b :: output_array([1..2]);
          constraint int_eq(b[1], 1);
          constraint int_eq(b[2], 0);
          solve maximize x;
          EOF
          out=$($BIN --mzn "$t/mzn.fzn")
          echo "$out" | grep -q "x = 5;"
          echo "$out" | grep -qF "b = array1d(1..2, [true, false]);"
          echo "$out" | grep -q -- "----------"
          echo "$out" | grep -q "=========="

          # MiniZinc protocol: unsatisfiable.
          cat > "$t/unsat.fzn" <<'EOF'
          var 1..2: x;
          constraint int_lt(x, 1);
          solve satisfy;
          EOF
          $BIN --mzn "$t/unsat.fzn" | grep -q "=====UNSATISFIABLE====="

          echo "all protocol checks passed"

      - name: Corpus parse check
        run: |
          set -euo pipefail
          if [ ! -d data/fzn/challenge ]; then
            echo "data/fzn not in checkout; skipping"
            exit 0
          fi
          BIN=target/release/qayd-fzn
          err=0
          for f in $(find data/fzn -name '*.fzn'); do
            out=$(timeout 10 $BIN -t 1 "$f" 2>&1) || true
            if echo "$out" | grep -qiE "error|panic"; then
              err=$((err+1))
              echo "FAIL $f"
              echo "$out" | grep -iE "error|panic" | head -1
            fi
          done
          echo "instances failing: $err"
          exit $err
